services:

  suitecrm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suitecrm
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - suitecrm_code:/var/www/html
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: suitecrm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrm
    ports:
      - "3309:3306"
    volumes:
      - suitecrm_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  suitecrm_code:
  suitecrm_mysql_data:
