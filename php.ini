memory_limit = 512M

upload_max_filesize = 64M
post_max_size = 64M

max_execution_time = 300
max_input_time = 300

date.timezone = Asia/Jakarta

; =============================================================
; OPcache -- tanpa ini, PHP compile ulang SEMUA file dari nol
; tiap request. SuiteCRM baca ratusan file PHP per halaman,
; jadi ini dampaknya cukup terasa.
; =============================================================
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Production optimized: disable dynamic validation for max speed
; Restart container when code changes
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; =============================================================
; Realpath cache -- membantu mempercepat resolusi path file,
; lebih cepat dengan volume dibanding bind mount Windows
; =============================================================
realpath_cache_size = 4096k
realpath_cache_ttl = 600
